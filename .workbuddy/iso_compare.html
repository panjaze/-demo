    <!-- 5x4 正交格 -->

  </g>

  <text x="380" y="520" font-size="14" fill="#888" text-anchor="middle">立绘有透视（斜俯视小房子），地面是纯平网格 → 建筑"浮"在图上，像贴纸</text>

  <!-- 中缝分隔 -->
  <line x1="765" y1="30" x2="765" y2="830" stroke="#d8d8d8" stroke-width="2"/>

  <!-- ============ 右：提案 等轴测 ============ -->
  <text x="1160" y="52" font-size="22" font-weight="bold" fill="#2F7D32" text-anchor="middle">提案 · 等轴测 2:1 菱形（率土 / 文明式视角）</text>
  <g id="iso">
    <!-- 等轴菱形格：逻辑 5x4，sx=(x-y)*55+560, sy=(x+y)*27.5+150 -->
    <g>
      <polygon points="1000,95 1055,122.5 1000,150 945,122.5" fill="#8fae66"/>
      <polygon points="1055,122.5 1110,150 1055,177.5 1000,150" fill="#97b56d"/>
      <polygon points="1110,150 1165,177.5 1110,205 1055,177.5" fill="#8fae66"/>
      <polygon points="1165,177.5 1220,205 1165,232.5 1110,205" fill="#97b56d"/>
      <polygon points="1220,205 1275,232.5 1220,260 1165,232.5" fill="#8fae66"/>

      <polygon points="945,122.5 1000,150 945,177.5 890,150" fill="#97b56d"/>
      <polygon points="1000,150 1055,177.5 1000,205 945,177.5" fill="#8fae66"/>
      <polygon points="1055,177.5 1110,205 1055,232.5 1000,205" fill="#97b56d"/>
      <polygon points="1110,205 1165,232.5 1110,260 1055,232.5" fill="#8fae66"/>
      <polygon points="1165,232.5 1220,260 1165,287.5 1110,260" fill="#97b56d"/>

      <polygon points="890,150 945,177.5 890,205 835,177.5" fill="#8fae66"/>
      <polygon points="945,177.5 1000,205 945,232.5 890,205" fill="#97b56d"/>
      <polygon points="1000,205 1055,232.5 1000,260 945,232.5" fill="#8fae66"/>
      <polygon points="1055,232.5 1110,260 1055,287.5 1000,260" fill="#97b56d"/>
      <polygon points="1110,260 1165,287.5 1110,315 1055,287.5" fill="#97b56d"/>

      <polygon points="835,177.5 890,205 835,232.5 780,205" fill="#97b56d"/>
      <polygon points="890,205 945,232.5 890,260 835,232.5" fill="#8fae66"/>
      <polygon points="945,232.5 1000,260 945,287.5 890,260" fill="#97b56d"/>
      <polygon points="1000,260 1055,287.5 1000,315 945,287.5" fill="#8fae66"/>
      <polygon points="1055,287.5 1110,315 1055,342.5 1000,315" fill="#97b56d"/>
    </g>
    <!-- 官道：沿逻辑 x 方向 y=1 行：格心 (505,177.5)→(725,232.5+...) 实际点：(505,177.5)(615,232.5)? 计算：格(x,y)心 sx=(x-y)*55+560, sy=(x+y)*27.5+150
         (0,1)→(505,177.5) (1,1)→(615,205)? (1-1)*55+560=560? 等等 (x-y)*55+560: (0,1)=505; (1,1)=560+? (1-1)*55+560=560, sy=(2)*27.5+150=205 → (560,205)
         (2,1)=(615,232.5) (3,1)=(670,260) -->
    <polyline points="945,177.5 1000,205 1055,232.5 1110,260" fill="none" stroke="#b39b6f" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <polyline points="945,177.5 1000,205 1055,232.5 1110,260" fill="none" stroke="#c9b384" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 建筑：底对齐格心，按 sy 排序（远→近） -->
    <!-- (1,0) farm: sx=(1-0)*55+560+440=1055, sy=177.5 -->
    <ellipse cx="1055" cy="180" rx="40" ry="12" fill="rgba(0,0,0,0.18)"/>
    <image href="../卡牌建城demo/assets/buildings/farm.png" x="1014" y="102" width="82" height="82"/>
    <!-- (3,0) barracks: sx=1165, sy=232.5 -->
    <ellipse cx="1165" cy="235" rx="40" ry="12" fill="rgba(0,0,0,0.18)"/>
    <image href="../卡牌建城demo/assets/buildings/barracks.png" x="1124" y="157" width="82" height="82"/>
    <!-- (1,3) castle: sx=890, sy=260 -->
    <ellipse cx="890" cy="262" rx="44" ry="13" fill="rgba(0,0,0,0.18)"/>
    <image href="../卡牌建城demo/assets/buildings/castle.png" x="847" y="171" width="86" height="86"/>
    <!-- (2,3) power: sx=945, sy=287.5 -->
    <ellipse cx="945" cy="290" rx="38" ry="11" fill="rgba(0,0,0,0.18)"/>

    <text x="1000" y="258" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">12</text>
    <!-- (0,3) 红徽章: sx=835, sy=232.5 -->
    <circle cx="835" cy="226" r="17" fill="rgba(8,14,22,0.92)" stroke="#d9604a" stroke-width="3"/>
    <text x="835" y="232" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">7</text>
  </g>
  <text x="1160" y="520" font-size="14" fill="#888" text-anchor="middle">地面与建筑同视角：立绘"落"在菱形地面上，有前后遮挡与落地阴影 → 立体 SLG 观感</text>

  <!-- 底部结论条 -->
  <rect x="140" y="700" width="1280" height="120" rx="12" fill="#F4F1E4" stroke="#2F5496" stroke-width="2"/>
  <text x="780" y="745" font-size="17" fill="#1F3864" text-anchor="middle" font-weight="bold">等轴测 = 品类标准视角（率土 / 三战 / 文明），与现有斜俯视建筑立绘天然同视角</text>
  <text x="780" y="778" font-size="14" fill="#333" text-anchor="middle">代价：坐标换算 / 绘制深度排序 / 带状路 / 底图全部重做，像素断言与七层测试全量回归（估 1~2 个整天 + 底图重制）</text>
  <text x="780" y="804" font-size="14" fill="#333" text-anchor="middle">收益之外的风险：现有建筑立绘的透视角度需与 2:1 菱形目测校验，角度不合需重生成一批素材</text>
