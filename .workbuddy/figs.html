<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: "Microsoft YaHei", sans-serif; }
  .fig { background: #fff; }
  text { font-family: "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<!-- 图 1：核心循环 -->
<div class="fig" id="fig1" style="width:1280px; height:730px;">
<svg width="1280" height="730" viewBox="0 0 1280 730">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8A8A8A"/>
    </marker>
    <marker id="arwB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2F5496"/>
    </marker>
  </defs>
  <!-- 主链 第一行 y=110 -->
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="35"  y="80" width="190" height="62" rx="10" fill="#DCE6F1" stroke="#2F5496" stroke-width="2"/>
    <text x="130" y="105" fill="#1F3864">抽卡 / 开牌</text><text x="130" y="128" fill="#1F3864" font-size="12" font-weight="normal">(3⚡ · 费用递增)</text>
    <rect x="275" y="80" width="190" height="62" rx="10" fill="#DCE6F1" stroke="#2F5496" stroke-width="2"/>
    <text x="370" y="118" fill="#1F3864">买卡进手牌 (按标价)</text>
    <rect x="515" y="80" width="210" height="62" rx="10" fill="#DCE6F1" stroke="#2F5496" stroke-width="2"/>
    <text x="620" y="105" fill="#1F3864">建造 · 铺路</text><text x="620" y="128" fill="#1F3864" font-size="12" font-weight="normal">(城市沿路生长)</text>
    <rect x="775" y="80" width="210" height="62" rx="10" fill="#DCE6F1" stroke="#2F5496" stroke-width="2"/>
    <text x="880" y="105" fill="#1F3864">资源产出</text><text x="880" y="128" fill="#1F3864" font-size="12" font-weight="normal">(每 10s 经济 Tick)</text>
  </g>
  <line x1="225" y1="111" x2="270" y2="111" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="465" y1="111" x2="510" y2="111" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="725" y1="111" x2="770" y2="111" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw)"/>
  <!-- 下行到第二行 -->
  <line x1="880" y1="142" x2="880" y2="255" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw)"/>
  <text x="985" y="205" font-size="12" fill="#333">能量 / 粮食转化</text>
  <!-- 第二行 y=290（深蓝实底） -->
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="775" y="225" width="210" height="62" rx="10" fill="#2F5496" stroke="#1F3864" stroke-width="2"/>
    <text x="880" y="250" fill="#fff">出兵行军</text><text x="880" y="273" fill="#DCE6F1" font-size="12" font-weight="normal">(沿路 · 1.6s/格)</text>
    <rect x="500" y="225" width="210" height="62" rx="10" fill="#2F5496" stroke="#1F3864" stroke-width="2"/>
    <text x="605" y="262" fill="#fff">抢点 / 攻城 / 守家</text>
    <rect x="225" y="225" width="210" height="62" rx="10" fill="#2F5496" stroke="#1F3864" stroke-width="2"/>
    <text x="330" y="250" fill="#fff">战果</text><text x="330" y="273" fill="#DCE6F1" font-size="12" font-weight="normal">(占领 · 任务 · 计分)</text>
  </g>
  <line x1="775" y1="256" x2="715" y2="256" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="500" y1="256" x2="440" y2="256" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw)"/>
  <!-- 回环：战果 → 抽卡 -->
  <polyline points="225,256 130,256 130,150" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arw)"/>
  <text x="128" y="205" font-size="12" fill="#333" text-anchor="middle">资源反哺</text><text x="128" y="222" font-size="12" fill="#333" text-anchor="middle">构筑迭代</text>
  <!-- 胜利终点 -->
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="1035" y="225" width="225" height="62" rx="10" fill="#1F3864" stroke="#1F3864"/>
    <text x="1147" y="250" fill="#fff">摧毁敌方主城 = 胜利</text><text x="1147" y="273" fill="#DCE6F1" font-size="12" font-weight="normal">(1800s 兜底计分)</text>
  </g>
  <line x1="985" y1="256" x2="1030" y2="256" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw)"/>
  <!-- 侧支：弃牌 → 任务 → 遗物 -->
  <g font-size="13" text-anchor="middle">
    <rect x="140" y="600" width="170" height="52" rx="9" fill="#fff" stroke="#2F5496" stroke-width="1.6"/>
    <text x="225" y="632" fill="#1F3864">弃牌 (手牌管理)</text>
    <rect x="380" y="600" width="190" height="52" rx="9" fill="#fff" stroke="#2F5496" stroke-width="1.6"/>
    <text x="475" y="632" fill="#1F3864">星级任务 (3星×5项)</text>
    <rect x="640" y="600" width="190" height="52" rx="9" fill="#fff" stroke="#2F5496" stroke-width="1.6"/>
    <text x="735" y="632" fill="#1F3864">遗物成长 (13池·限3)</text>
  </g>
  <line x1="310" y1="626" x2="375" y2="626" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="570" y1="626" x2="635" y2="626" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="735" y1="600" x2="620" y2="292" stroke="#2F5496" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arwB)"/>
  <text x="705" y="470" font-size="12" fill="#2F5496">全局 buff</text>
  <!-- 侧支：主城升级 → 政策 -->
  <g font-size="13" text-anchor="middle">
    <rect x="880" y="600" width="190" height="52" rx="9" fill="#fff" stroke="#2F5496" stroke-width="1.6"/>
    <text x="975" y="632" fill="#1F3864">政策三选一 (升本触发)</text>
    <rect x="1120" y="600" width="130" height="52" rx="9" fill="#fff" stroke="#2F5496" stroke-width="1.6"/>
    <text x="1185" y="632" fill="#1F3864">构筑路径</text>
  </g>
  <line x1="1070" y1="626" x2="1115" y2="626" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw)"/>
  <polyline points="1185,600 1185,180 895,180 880,148" fill="none" stroke="#2F5496" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arwB)"/>
  <text x="1105" y="395" font-size="12" fill="#2F5496" text-anchor="middle">主城升级触发</text>
  <text x="30" y="700" font-size="12" fill="#888">《拓边令》核心循环 · 道路系统位于"建造·铺路"与"出兵行军"两环</text>
</svg>
</div>

<div style="height:40px"></div>

<!-- 图 2：铺路合法性判定 -->
<div class="fig" id="fig2" style="width:920px; height:1180px;">
<svg width="920" height="1180" viewBox="0 0 920 1180">
  <defs>
    <marker id="arw2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8A8A8A"/>
    </marker>
    <marker id="arw2b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2F5496"/>
    </marker>
  </defs>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="200" y="20" width="440" height="54" rx="10" fill="#2F5496"/>
    <text x="420" y="53" fill="#fff">道路牌 → 铺路模式（全图可铺格高亮）</text>
  </g>
  <line x1="420" y1="74" x2="420" y2="120" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arw2)"/>

  <!-- 四个判定菱形 + 右侧拒绝框 -->
  <g font-size="13" text-anchor="middle">
    <polygon points="420,120 640,190 420,260 200,190" fill="#DCE6F1" stroke="#2F5496" stroke-width="2"/>
    <text x="420" y="180" fill="#1F3864" font-weight="bold">a. 格位互斥？</text>
    <text x="420" y="205" fill="#1F3864" font-size="12">空地（非道路 / 建筑 / 资源点 / 水 / 山 / 林）</text>

    <polygon points="420,300 640,370 420,440 200,370" fill="#DCE6F1" stroke="#2F5496" stroke-width="2"/>
    <text x="420" y="360" fill="#1F3864" font-weight="bold">b. 本方前沿？</text>
    <text x="420" y="385" fill="#1F3864" font-size="12">与本方主城连通（禁止隔空铺设）</text>

    <polygon points="420,480 640,550 420,620 200,550" fill="#DCE6F1" stroke="#2F5496" stroke-width="2"/>
    <text x="420" y="540" fill="#1F3864" font-weight="bold">c. 额度剩余？</text>
    <text x="420" y="565" fill="#1F3864" font-size="12">已用 &lt; 100（官道 / 桥不占额）</text>

    <polygon points="420,660 640,730 420,800 200,730" fill="#DCE6F1" stroke="#2F5496" stroke-width="2"/>
    <text x="420" y="720" fill="#1F3864" font-weight="bold">d. 能量 ≥ 道路牌单价？</text>
    <text x="420" y="745" fill="#1F3864" font-size="12">土路 2⚡ / 石路 5⚡ / 大道 10⚡</text>
  </g>

  <g font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="680" y="160" width="215" height="60" rx="9" fill="#FBEAEA" stroke="#C00000" stroke-width="1.8"/>
    <text x="787" y="185" fill="#C00000">✗ 拒绝</text><text x="787" y="206" fill="#C00000" font-weight="normal" font-size="12">「此处无法铺路」</text>
    <rect x="680" y="340" width="215" height="60" rx="9" fill="#FBEAEA" stroke="#C00000" stroke-width="1.8"/>
    <text x="787" y="365" fill="#C00000">✗ 拒绝</text><text x="787" y="386" fill="#C00000" font-weight="normal" font-size="12">「此处无法铺路」</text>
    <rect x="680" y="520" width="215" height="60" rx="9" fill="#FBEAEA" stroke="#C00000" stroke-width="1.8"/>
    <text x="787" y="545" fill="#C00000">✗ 拒绝</text><text x="787" y="566" fill="#C00000" font-weight="normal" font-size="12">「额度已满，先拆旧路」</text>
    <rect x="680" y="700" width="215" height="60" rx="9" fill="#FBEAEA" stroke="#C00000" stroke-width="1.8"/>
    <text x="787" y="725" fill="#C00000">✗ 手牌置灰</text><text x="787" y="746" fill="#C00000" font-weight="normal" font-size="12">「能量不足」</text>
  </g>

  <g stroke="#8A8A8A" stroke-width="2">
    <line x1="640" y1="190" x2="675" y2="190" marker-end="url(#arw2)"/>
    <line x1="640" y1="370" x2="675" y2="370" marker-end="url(#arw2)"/>
    <line x1="640" y1="550" x2="675" y2="550" marker-end="url(#arw2)"/>
    <line x1="640" y1="730" x2="675" y2="730" marker-end="url(#arw2)"/>
    <line x1="420" y1="260" x2="420" y2="300" marker-end="url(#arw2)"/>
    <line x1="420" y1="440" x2="420" y2="480" marker-end="url(#arw2)"/>
    <line x1="420" y1="620" x2="420" y2="660" marker-end="url(#arw2)"/>
    <line x1="420" y1="800" x2="420" y2="840" marker-end="url(#arw2b)"/>
  </g>
  <g font-size="13" fill="#2F5496">
    <text x="432" y="285">是</text><text x="432" y="465">是</text><text x="432" y="645">是</text>
  </g>
  <g font-size="13" fill="#C00000">
    <text x="650" y="180">否</text><text x="650" y="360">否</text><text x="650" y="540">否</text><text x="650" y="720">否</text>
  </g>

  <g font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="200" y="845" width="440" height="70" rx="10" fill="#2F5496"/>
    <text x="420" y="875" fill="#fff">✓ 铺设成功</text>
    <text x="420" y="900" fill="#DCE6F1" font-size="13" font-weight="normal">扣能量 · 占 1 格额度 · 城市向前生长</text>
  </g>

  <text x="30" y="960" font-size="13" fill="#666">※ 拆除己方道路可释放 1 格额度（铺拆结合）</text>
  <text x="30" y="985" font-size="13" fill="#666">※ 预设官道 / 桥不占额度、不可拆除</text>
  <text x="30" y="1010" font-size="13" fill="#666">※ 铺路模式中点己方道路格 → 操作条「拆除道路（释放 1 格额度）」</text>
  <text x="30" y="1035" font-size="13" fill="#666">※ AI 铺路走同一套判定 + 半区限制（离 AI 主城 ≤ 离玩家主城）</text>
</svg>
</div>
</body>
</html>
